<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>더지팡팡</title><meta name="description" content="미션에 맞는 수와 식을 든 두더지만 골라 잡는 레이싱 콘셉트 수학 게임"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* 레이아웃: 한 열짜리 모눈공책 한 쪽. 위에서부터 채점 현황 → 형광펜 미션 → 3×3 두더지 밭.
   밝은 테마는 모눈공책과 빨간 채점펜, 어두운 테마는 칠판과 분필. */
:root{
  --bg:#F3F7FF; --grid:#CFDDF4; --ink:#18264A; --ink-soft:#56668A;
  --pen:#E3342F; --hl:#FFE04D; --hl-ink:#18264A;
  --mole:#8E6040; --mole-shade:#6F482B; --snout:#F2C9A8; --pit:#222E4C;
  --sign:#FFFFFF; --sign-ink:#18264A; --panel:#FFFFFF; --line:#B9CBEA; --good:#16885B;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-math:"Fredoka","Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--f-body); font-weight:400; font-size:17px; line-height:1.45;
  padding-block:20px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.page{max-width:540px; margin:0 auto; display:flex; flex-direction:column; gap:14px}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--pen); outline-offset:2px}

/* 머리말 */
.top{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap}
h1{font-family:var(--f-display); font-weight:400; font-size:clamp(28px,8vw,40px); line-height:1.1; margin:0; text-wrap:balance}
h1 span{color:var(--pen)}
.ghost{background:none; border:1.5px solid var(--line); border-radius:999px; padding:4px 12px; font-size:14px; color:var(--ink-soft)}

/* 패널 */
.panel{background:var(--panel); border:2px solid var(--ink); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:14px}
.panel p{margin:0}
.levels{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; border:0; padding:0; margin:0}
.levels legend{font-family:var(--f-display); font-size:18px; padding:0; margin-bottom:8px}
.levels label{position:relative; display:block; min-width:0}
.levels input{position:absolute; opacity:0; inset:0; width:100%; height:100%; margin:0; cursor:pointer}
.levels .lv{display:flex; flex-direction:column; align-items:center; gap:2px; height:100%; border:2px solid var(--line); border-radius:10px; padding:8px 10px}
.levels .lv b{font-family:var(--f-display); font-weight:400; font-size:20px}
.levels input:checked + .lv{border-color:var(--ink); background:var(--hl); color:var(--hl-ink)}
.levels input:focus-visible + .lv{outline:3px solid var(--pen); outline-offset:2px}
.go{font-family:var(--f-display); font-size:24px; background:var(--pen); color:#fff; border:2px solid var(--ink); border-radius:12px; padding:10px 16px; box-shadow:0 4px 0 var(--ink); transition:transform .08s, box-shadow .08s}
.go:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
.hint{font-size:13px; color:var(--ink-soft)}
.best{font-size:14px; color:var(--ink-soft)}

/* 채점 현황 */
#hudWrap{display:flex; flex-direction:column; gap:8px}
.hud{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; align-items:end}
.hud div{display:flex; flex-direction:column; min-width:0}
.hud div:nth-child(2){align-items:center}
.hud div:nth-child(3){align-items:flex-end}
.hud small{font-size:12px; letter-spacing:.08em; color:var(--ink-soft)}
.hud strong{font-family:var(--f-display); font-weight:400; font-size:30px; line-height:1; font-variant-numeric:tabular-nums}
#combo.hot{color:var(--pen)}
#combo.bump{animation:pop .18s}
.bar{height:10px; border:2px solid var(--ink); border-radius:999px; background:var(--panel); overflow:hidden}
.bar i{display:block; height:100%; width:100%; background:var(--good); transform-origin:left}
.bar.low i{background:var(--pen)}

/* 미션 */
.mission{background:var(--hl); color:var(--hl-ink); border:2px solid var(--ink); border-radius:6px 14px 8px 12px; padding:8px 14px; text-align:center; transform:rotate(-.6deg)}
.mission small{display:block; font-size:12px; letter-spacing:.1em}
.mission p{margin:0; font-family:var(--f-display); font-size:clamp(22px,6.4vw,30px); line-height:1.2; text-wrap:balance}
.mission em{font-style:normal; color:var(--pen); -webkit-text-stroke:.5px var(--hl-ink)}
.mission.swap{animation:swap .5s}

/* 두더지 밭 */
.mx{display:inline-block; white-space:nowrap}
.msign sup,.msign sub{font-size:.6em; line-height:0; position:relative; vertical-align:baseline; margin-left:.04em}
.msign sup{top:-.62em}
.msign sub{top:.32em}
.fr{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; font-size:.78em; line-height:1.05; margin:0 .08em}
.fr i{font-style:normal; padding:0 .15em}
.fr i:first-child{border-bottom:.09em solid currentColor}
.sqrt{display:inline-flex; align-items:flex-start; vertical-align:middle; line-height:1}
.rs{width:.6em; height:1.16em; flex:none; overflow:visible}
.rad{border-top:.085em solid currentColor; padding:.12em .1em 0 .05em; margin-left:-.03em}
.stamp.ok{border:max(4px,5cqw) solid var(--pen); border-radius:50%; animation:stamp .45s forwards}
.stamp.no{animation:stamp .45s forwards}
.stamp.no::before{content:""; position:absolute; left:50%; top:-6%; bottom:-6%; width:max(4px,5cqw); margin-left:-2.5cqw; background:var(--pen); border-radius:4px; transform:rotate(38deg)}
.cell.shake{animation:shake .25s}
.float{position:absolute; left:0; right:0; top:2%; text-align:center; font-family:var(--f-display); font-size:20cqw; color:var(--pen); pointer-events:none; animation:float .7s forwards; text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}
.float.plus{color:var(--good)}

.under{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}

/* 결과 */
.score-big{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.score-big .ring{font-family:var(--f-display); font-size:44px; line-height:1; color:var(--pen); border:4px solid var(--pen); border-radius:50%; padding:14px 20px; transform:rotate(-6deg); font-variant-numeric:tabular-nums}
.score-big p{margin:0}
h2{font-family:var(--f-display); font-weight:400; font-size:22px; margin:0}
h3{font-family:var(--f-display); font-weight:400; font-size:18px; margin:0}
.scroll{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:15px}
th,td{text-align:left; padding:6px 8px; border-bottom:1px solid var(--line)}
th{font-weight:400; color:var(--ink-soft); font-size:13px}
td.n,th.n{text-align:right; font-variant-numeric:tabular-nums}
.review{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; font-size:15px}
.review li{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; border-bottom:1px dashed var(--line); padding-bottom:6px}
.review .it{font-family:var(--f-math); font-weight:600; font-size:17px}
.review .tag{font-size:12px; border:1.5px solid var(--pen); color:var(--pen); border-radius:999px; padding:0 8px}
.review .why{color:var(--ink-soft)}
.row{display:flex; gap:10px; flex-wrap:wrap}
.row .go{flex:1 1 180px}

/* 그림 에셋 버전 */
h1{-webkit-text-stroke:7px #fff; paint-order:stroke fill}
.hud small,.hint,.best{text-shadow:0 0 4px #fff,0 0 4px #fff}
.boardWrap{position:relative}
#hudWrap{background:rgba(255,255,255,.9); border:2px solid var(--ink); border-radius:14px; padding:8px 14px 10px}
.board{display:grid; grid-template-columns:repeat(3,1fr); gap:0 6px; width:min(100%,50dvh); margin:0 auto; user-select:none; -webkit-user-select:none; touch-action:manipulation}
.cell{position:relative; aspect-ratio:1/1.22; background:none; border:0; padding:0; container-type:inline-size; -webkit-tap-highlight-color:transparent}
.pop{position:absolute; inset:0; pointer-events:none; clip-path:polygon(-10% 0, 110% 0, 110% 83%, 95.0% 83.0%, 94.1% 85.5%, 91.6% 88.0%, 87.4% 90.2%, 81.8% 92.2%, 75.0% 93.8%, 67.2% 95.0%, 58.8% 95.8%, 50.0% 96.0%, 41.2% 95.8%, 32.8% 95.0%, 25.0% 93.8%, 18.2% 92.2%, 12.6% 90.2%, 8.4% 88.0%, 5.9% 85.5%, 5.0% 83.0%, -10% 83%)}
.m{position:absolute; left:0; width:100%; bottom:15%; aspect-ratio:702/751; transform:translateY(115%); transition:transform .13s cubic-bezier(.3,1.5,.5,1); transform-origin:50% 100%}
.cell.up .m{transform:none}
.cell.up.hit .m{transform:translateY(6%) scale(1.07,.88); transition-duration:.07s}
.m img{position:absolute; inset:0; width:100%; height:100%; opacity:0}
.m img.f0{opacity:1}
.cell.hit .m img.f0{opacity:0}
.cell.hit:not(.laugh) .m img.f1{opacity:1}
.cell.hit.laugh .m img.f2{opacity:1}
.cell.gold .m img{filter:sepia(1) saturate(2.8) hue-rotate(-14deg) brightness(1.2) drop-shadow(0 0 5px #FFD84D)}
.msign{position:absolute; left:12.5%; width:75.5%; top:58.5%; height:33%; display:flex; align-items:center; justify-content:center; color:#18264A; font-family:var(--f-math); font-weight:600; white-space:nowrap; line-height:1; font-size:24cqw}
.stamp{position:absolute; left:8%; right:8%; top:14%; aspect-ratio:1; pointer-events:none; opacity:0}
.board.x3 .hole{filter:drop-shadow(0 0 6px var(--hl))}
#shout{position:absolute; left:0; right:0; top:34%; text-align:center; font-family:var(--f-display); font-size:clamp(30px,10vw,50px); line-height:1.1; color:var(--pen); -webkit-text-stroke:7px #fff; paint-order:stroke fill; pointer-events:none; opacity:0; z-index:5}
#shout.on{animation:shout .95s}
@keyframes shout{0%{opacity:0; transform:scale(.4) rotate(-8deg)} 18%{opacity:1; transform:scale(1.15) rotate(-4deg)} 30%{transform:scale(1) rotate(-4deg)} 75%{opacity:1} 100%{opacity:0; transform:scale(1) translateY(-20px) rotate(-4deg)}}
.rank{font-family:var(--f-display); font-size:22px; color:var(--pen)}

/* 재미 요소 */
.tagline{margin:2px 0 0; font-size:14px; color:var(--ink); text-shadow:0 0 4px #fff,0 0 4px #fff,0 0 4px #fff}
.say{position:absolute; left:50%; top:0; transform:translateX(-50%) scale(0); transform-origin:50% 100%; background:#fff; color:#18264A; border:2px solid #18264A; border-radius:999px; padding:.1em .6em; font-family:var(--f-display); font-size:10.5cqw; white-space:nowrap; line-height:1.3; transition:transform .12s; z-index:2}
.say.on{transform:translateX(-50%) scale(1)}
.cell.ice .m img{filter:hue-rotate(175deg) saturate(1.4) brightness(1.12) drop-shadow(0 0 5px #7FD4FF)}
.star{position:absolute; left:50%; top:45%; font-size:13cqw; color:#FFC400; -webkit-text-stroke:1px #18264A; pointer-events:none; animation:star .5s ease-out forwards; z-index:4}
@keyframes star{from{opacity:1; transform:translate(-50%,-50%) scale(.4)} to{opacity:0; transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2) rotate(140deg)}}
.boardWrap.quake{animation:shake .25s}
.boardWrap.fever .hole{filter:drop-shadow(0 0 7px #FF5A36)}
.boardWrap.fever::before{content:"부스터 타임! 전부 때려!"; position:absolute; left:50%; top:-6px; transform:translateX(-50%); z-index:6; background:var(--pen); color:#fff; font-family:var(--f-display); font-size:18px; padding:2px 14px; border-radius:999px; border:2px solid var(--ink); white-space:nowrap; animation:pulse .4s infinite alternate}
@keyframes pulse{to{transform:translateX(-50%) scale(1.1)}}
#time.ice{color:#1E90FF}
@media (prefers-reduced-motion: reduce){ .boardWrap.quake,.boardWrap.fever::before,.star{animation:none} .star{display:none} }

/* 랭킹 */
.nickrow{display:flex; align-items:center; gap:10px}
.recbox{background:var(--hl); border:2px solid var(--ink); border-radius:12px; padding:10px 12px; display:flex; flex-direction:column; gap:8px}
.recbox p{font-family:var(--f-display); font-size:18px}
.recbox .ghost{background:var(--pen); color:#fff; border-color:var(--ink); font-family:var(--f-display); font-size:17px; padding:6px 16px}
.nickrow label{font-family:var(--f-display); font-size:18px}
.nickrow input{flex:1; min-width:0; font:inherit; padding:8px 12px; border:2px solid var(--ink); border-radius:10px; background:#fff; color:var(--ink)}
.ranks{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px}
.ranks>div{min-width:0; display:flex; flex-direction:column; gap:6px}
.rank-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.rank-list li{display:grid; grid-template-columns:2em 1fr auto; gap:8px; padding:5px 6px; border-bottom:1px dashed var(--line); font-size:15px; align-items:baseline}
.rank-list li span:nth-child(2){min-width:0; overflow-wrap:anywhere}
.rank-list li span:first-child{font-family:var(--f-display); color:var(--ink-soft)}
.rank-list li:first-child span:first-child{color:var(--pen); font-size:18px}
.rank-list li span:last-child{font-variant-numeric:tabular-nums; font-family:var(--f-display)}
.rank-list li.me{background:var(--hl); border-radius:6px}
.rank-list li.empty{display:block; color:var(--ink-soft)}
body[data-screen="play"] #rankPanel{display:none}

/* 그림 설명 */
.how3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.how3 figure{margin:0; min-width:0; text-align:center}
.pic{position:relative; aspect-ratio:702/751; container-type:inline-size}
.pic img{position:absolute; inset:0; width:100%; height:100%}
.goldpic img{filter:sepia(1) saturate(2.8) hue-rotate(-14deg) brightness(1.2) drop-shadow(0 0 5px #FFD84D)}
.mk{position:absolute; left:16%; right:16%; top:6%; aspect-ratio:1}
.mk.ok{border:5px solid var(--pen); border-radius:50%}
.mk.no::before{content:""; position:absolute; left:50%; top:-4%; bottom:-4%; width:6px; margin-left:-3px; background:var(--pen); border-radius:4px; transform:rotate(38deg)}
.how3 figcaption{font-family:var(--f-display); font-size:17px}
.how3 figcaption b{font-weight:400; color:var(--pen)}
.howcap{text-align:center; font-size:13.5px; color:var(--ink-soft)}

/* 오락실 게임기 */
body{background:#141833; background-image:radial-gradient(circle at 15% 8%,#3b2a7a 0,transparent 38%),radial-gradient(circle at 88% 30%,#7a2350 0,transparent 34%),radial-gradient(circle at 40% 95%,#12506b 0,transparent 40%); background-attachment:fixed; background-size:auto}
.top{background:#18264A; border:4px solid #FFC93C; border-radius:18px; padding:16px 16px 12px; position:relative; align-items:center; box-shadow:0 6px 0 #0b1020}
.top::before,.top::after{content:""; position:absolute; left:10px; right:10px; height:8px; background:radial-gradient(circle,#FFF3B0 2.6px,transparent 3.2px) 0 0/16px 8px repeat-x}
.top::before{top:3px} .top::after{bottom:2px}
h1{-webkit-text-stroke:0; color:#FFE04D; text-shadow:0 0 12px #FFB800,0 3px 0 #B86E00; font-size:clamp(34px,10vw,48px); letter-spacing:.04em}
h1 span{color:#FF7A6B; text-shadow:0 0 12px #FF3B2F,0 3px 0 #8E1B14}
.tagline{color:#CFE0FF; text-shadow:none; font-size:17px}
.top .ghost{color:#fff; border-color:#ffffff88; font-size:16px}
.hud small,.hint,.best{text-shadow:none}
.hint{font-size:16px}
.cab{background:linear-gradient(#F0483E,#C92A2A); border:4px solid #18264A; border-radius:24px; padding:12px; display:flex; flex-direction:column; gap:10px; box-shadow:0 8px 0 #0b1020, inset 0 3px 0 #ff8a80}
#hudWrap{background:#0B1020; border:3px solid #18264A; border-radius:12px; padding:8px 14px 10px; box-shadow:inset 0 0 0 2px #26335e}
.hud small{color:#8FB4FF; font-size:14px; letter-spacing:.04em}
.hud strong{font-family:var(--f-math); font-weight:700; color:#FFD23F; text-shadow:0 0 8px #FF9D00; font-size:32px}
#combo.hot{color:#FF7A6B; text-shadow:0 0 8px #FF3B2F}
#time.ice{color:#7FD4FF; text-shadow:0 0 8px #1E90FF}
.bar{background:#1b2444; border-color:#26335e}
.bar i{background:#4BE08A} .bar.low i{background:#FF5A4D}
.mission{background:#FFF8E1; border:4px solid #0B1020; border-radius:12px; transform:none; box-shadow:inset 0 0 0 3px #FFD23F}
.mission small{font-size:14px}
.mission.swap{animation:swap2 .45s}
@keyframes swap2{30%{transform:scale(1.06)}}
.boardWrap{background:linear-gradient(#FFD84D,#F5B400); border:4px solid #18264A; border-radius:18px; padding:4px 10px 14px; box-shadow:inset 0 4px 0 #FFEFA3, inset 0 -8px 0 #D99500; touch-action:manipulation}
.boardWrap::after{content:""; position:absolute; left:14px; right:14px; bottom:3px; height:5px; border-radius:3px; background:repeating-linear-gradient(135deg,#18264A 0 8px,transparent 8px 16px); opacity:.35}
.board{width:min(100%,48dvh)}
.board.thump{animation:thump .1s}
@keyframes thump{50%{transform:translateY(3px)}}
.hole,.lip{position:absolute; left:5%; right:5%; bottom:4%; height:26%; border-radius:50%; pointer-events:none}
.hole{background:radial-gradient(ellipse at 50% 30%,#050816 40%,#1c2a5c 100%); box-shadow:0 0 0 max(3px,3.5cqw) #D7372F, 0 0 0 max(5px,5cqw) #18264A, inset 0 6px 10px #000}
.lip{box-shadow:0 0 0 max(3px,3.5cqw) #D7372F, 0 0 0 max(5px,5cqw) #18264A; clip-path:inset(50% -12% -40% -12%)}
.cab .under .hint{color:#FFE9E0}
.cab .ghost{color:#fff; border-color:#ffffffaa; font-size:16px}
.float{text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.cell.up.hit .m{transform:translateY(16%) scale(1.14,.72)}
.pow{position:fixed; width:70px; height:70px; margin:-35px 0 0 -35px; pointer-events:none; z-index:55; background:#fff; clip-path:polygon(50% 0,61% 28%,90% 12%,74% 40%,100% 50%,74% 60%,90% 88%,61% 72%,50% 100%,39% 72%,10% 88%,26% 60%,0 50%,26% 40%,10% 12%,39% 28%); animation:pow .22s ease-out forwards}
@keyframes pow{from{transform:scale(.3); opacity:1; background:#FFE04D} to{transform:scale(1.25); opacity:0; background:#fff}}
@media (prefers-reduced-motion: reduce){ .board.thump,.pow{animation:none} .pow{display:none} }
.panel{box-shadow:0 6px 0 #0b1020}
.levels .lv b{font-size:22px}
.go{font-size:28px}

/* 화면 크기 맞춤 */
.hud small{letter-spacing:0} .mission small{letter-spacing:0}
.mission p{min-height:2.4em; display:flex; align-items:center; justify-content:center; flex-wrap:wrap; column-gap:.25em}
.top,.page>.panel{width:100%; max-width:540px; margin-inline:auto}
.cab{width:100%; max-width:540px; margin-inline:auto}
body[data-screen="play"] .top{display:none}
body[data-screen="play"] .board{width:min(100%, max(230px, calc((100dvh - 372px) / 1.33)))}

/* 레이싱 서킷 테마 */
:root{--ink:#1E2433; --ink-soft:#667089; --pen:#E5262B; --hl:#FFC400; --hl-ink:#1E2433; --line:#D5DBE8; --panel:#FFFFFF; --good:#1FA85A}
body{background:#3B4252; background-image:none}
body::before{content:""; position:fixed; inset:0; z-index:-1; background:#3B4252 var(--bgimg,none) center top/cover no-repeat}
.top{background:repeating-conic-gradient(#1E2433 0 25%,#fff 0 50%) 0 0/28px 28px; border:4px solid #1E2433; border-radius:20px; box-shadow:0 6px 0 #1E2433; padding:12px; margin-bottom:0}
.top::before,.top::after{display:none}
.top>div{background:#fff; border:3px solid #1E2433; border-radius:14px; padding:4px 18px 6px; box-shadow:4px 4px 0 #E5262B; transform:skewX(-6deg)}
h1{color:#E5262B; -webkit-text-stroke:0; text-shadow:3px 3px 0 #FFC400; letter-spacing:.02em}
h1 span{color:#1E6FE0; text-shadow:3px 3px 0 #FFC400}
.tagline{color:#667089; text-shadow:none}
.top .ghost,.cab .ghost,.ghost{background:#fff; color:#1E2433; border:3px solid #1E2433; border-radius:10px; box-shadow:0 3px 0 #1E2433; padding:4px 12px}
.panel{background:#fff; border:4px solid #1E2433; border-radius:20px; box-shadow:0 6px 0 #1E2433}

/* 배치: 미션 맨 위, 두더지 판 가운데 */

<div class="page">
  <header class="top">
    <div><h1>더지<span>팡팡</span></h1><p class="tagline">맞는 녀석만 골라서 뿅!</p></div>
    <button class="ghost" id="mute" type="button" aria-pressed="false">소리 켬</button>
  </header>

  <section class="panel" id="start">
    <fieldset class="levels">
      <legend>어디서 출발할까요?</legend>
      <label><input type="radio" name="level" id="lv-e" value="e"><span class="lv"><b>초등</b></span></label>
      <label><input type="radio" name="level" id="lv-m" value="m" checked><span class="lv"><b>중등</b></span></label>
      <label><input type="radio" name="level" id="lv-h" value="h"><span class="lv"><b>고등</b></span></label>
    </fieldset>
    <div class="how3">
      <figure><div class="pic"><img data-img="mole" alt=""><span class="msign">7</span><i class="mk ok"></i></div><figcaption>맞으면 <b>뿅!</b></figcaption></figure>
      <figure><div class="pic"><img data-img="mole_laugh" alt=""><span class="msign">51</span><i class="mk no"></i></div><figcaption>틀리면 <b>−2초</b></figcaption></figure>
      <figure><div class="pic goldpic"><img data-img="mole" alt=""><span class="msign">13</span></div><figcaption>황금은 <b>3배</b></figcaption></figure>
    </div>
    <p class="howcap">예: "소수만 잡아라!" · 10콤보면 부스터 타임 · 갈수록 빨라져요</p>
    <button class="go" id="go" type="button">출발!</button>
    <p class="best" id="best"></p>
    <p class="hint">키보드로도 됩니다. 숫자패드 1–9 또는 QWE · ASD · ZXC가 밭의 9칸입니다.</p>
  </section>

  <div class="cab" id="cab">
  <div id="hudWrap">
    <div class="hud">
      <div><small>점수</small><strong id="score">0</strong></div>
      <div><small>콤보</small><strong id="combo">0</strong></div>
      <div><small>남은 시간</small><strong id="time">60</strong></div>
    </div>
    <div class="bar" id="bar"><i id="barFill"></i></div>
  </div>

  <div class="mission" id="mission" aria-live="polite">
    <small id="mNo">미션 예시</small>
    <p id="mText"><em>소수</em>만 잡아라!</p>
  </div>

  <div class="boardWrap" id="boardWrap"><div class="board" id="board"></div><div id="shout" aria-hidden="true"></div></div>

  <div class="under" id="under">
    <span class="hint" id="multHint">맞는 두더지만 팡!</span>
    <button class="ghost" id="quit" type="button">그만하기</button>
  </div>
  </div>

  <section class="panel" id="result">
    <h2>채점 결과</h2>
    <div class="score-big">
      <div class="ring" id="rScore">0</div>
      <p id="rSummary"></p>
    </div>
    <div class="recbox" id="recBox" hidden>
      <p>신기록! 랭킹에 남길 별명을 적어 주세요.</p>
      <div class="nickrow"><label for="nick">별명</label><input id="nick" type="text" maxlength="8" placeholder="두더지" autocomplete="off"><button class="ghost" id="recSave" type="button">기록</button></div>
    </div>
    <h3>미션별 기록</h3>
    <div class="scroll">
      <table>
        <thead><tr><th>미션</th><th class="n">맞힘 ○</th><th class="n">잘못 침 ／</th><th class="n">놓침</th></tr></thead>
        <tbody id="rRows"></tbody>
      </table>
    </div>
    <h3 id="rvTitle">다시 볼 것</h3>
    <ul class="review" id="rReview"></ul>
    <div class="row">
      <button class="go" id="again" type="button">한 판 더</button>
      <button class="ghost" id="home" type="button">단계 바꾸기</button>
    </div>
  </section>

  <section class="panel" id="rankPanel">
    <h2 id="rankTitle">랭킹</h2>
    <div class="ranks">
      <div id="sharedBox" hidden><h3>전체 랭킹</h3><ol class="rank-list" id="rankShared"></ol><p class="hint" id="sharedNote"></p></div>
      <div><h3>이 기기 랭킹</h3><ol class="rank-list" id="rankLocal"></ol></div>
    </div>
  </section>
</div>

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const M = "−";
const R = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = a => a[R(0,a.length-1)];
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=R(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const fmt = n => n<0 ? M+Math.abs(n) : ""+n;
const frac = (a,b) => `<span class="fr"><i>${a}</i><i>${b}</i></span>`;
const rad = s => `<span class="sqrt"><svg class="rs" viewBox="0 0 12 23" preserveAspectRatio="none" aria-hidden="true"><path d="M1 14.5 L3.3 13 L6.2 21 L11 1 L12 1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg><span class="rad">${s}</span></span>`;
const sup = (b,e) => `${b}<sup>${e}</sup>`;
const log = (b,x) => `log<sub>${b}</sub>${x}`;

function term(c,p,first){
  if(c===0) return "";
  const s = c<0 ? M : (first ? "" : "+");
  const a = Math.abs(c);
  const v = p===0 ? ""+a : ((a===1?"":a)+"x"+(p>1?`<sup>${p}</sup>`:""));
  return s+v;
}
function poly(cs){ let out=""; const n=cs.length-1; cs.forEach((c,i)=>{ out+=term(c,n-i,out===""); }); return out||"0"; }

const PRIMES=[]; for(let n=2;n<100;n++){ let p=true; for(let d=2;d*d<=n;d++) if(n%d===0){p=false;break;} if(p) PRIMES.push(n); }
const smallestFactor = n => { for(let d=2;d*d<=n;d++) if(n%d===0) return d; return n; };

/* 풀(pool) 기반 규칙: [표시, 정답여부, 풀이] */
function poolRule(short,title,pool){
  return () => ({short,title,gen(want){ const c=pool.filter(x=>!!x[1]===want); const x=pick(c); return {h:x[0],ok:!!x[1],note:x[2]||""}; }});
}

/* ---------- 초등 ---------- */
function rMultiple(){
  const k=pick([3,4,6,7,8,9]);
  return {short:`${k}의 배수`, title:`<em>${k}의 배수</em>만 잡아라!`, gen(want){
    if(want){ const q=R(2,12); return {h:""+k*q, ok:true, note:`${k}×${q}`}; }
    let n; do{ n = Math.random()<.6 ? k*R(2,12)+pick([-1,1,2,-2]) : R(10,k*12); }while(n%k===0||n<2);
    return {h:""+n, ok:false, note:`${k}로 나누면 나머지 ${n%k}`};
  }};
}
function rDivisor(){
  const n=pick([24,36,48,60]);
  const ds=[]; for(let d=1;d<=n;d++) if(n%d===0) ds.push(d);
  const non=[]; for(let d=2;d<n;d++) if(n%d!==0) non.push(d);
  return {short:`${n}의 약수`, title:`<em>${n}의 약수</em>만 잡아라!`, gen(want){
    if(want){ const d=pick(ds); return {h:""+d, ok:true, note:`${n}÷${d}=${n/d}`}; }
    const d=pick(non); return {h:""+d, ok:false, note:`${n}÷${d}는 나누어떨어지지 않음`};
  }};
}
function exprOf(v){
  const ops=["+","-","/"]; const pairs=[];
  for(let a=2;a*a<=v;a++) if(v%a===0) pairs.push([a,v/a]);
  if(pairs.length) ops.push("*","*");
  const op=pick(ops);
  if(op==="+"){ const a=R(2,v-2); return `${a}+${v-a}`; }
  if(op==="-"){ const b=R(2,19); return `${v+b}${M}${b}`; }
  if(op==="/"){ const b=R(2,5); return `${v*b}÷${b}`; }
  const p=pick(pairs); return Math.random()<.5 ? `${p[0]}×${p[1]}` : `${p[1]}×${p[0]}`;
}
function rTarget(){
  const T=R(12,36);
  return {short:`값이 ${T}인 식`, title:`계산하면 <em>${T}</em>인 것만!`, gen(want){
    const v = want ? T : T+pick([-10,-2,-1,1,2,10]);
    return {h:exprOf(v), ok:want, note:`= ${v}`};
  }};
}
function rHalf(){
  return {short:"1/2보다 큰 분수", title:`${frac(1,2)}보다 <em>큰 분수</em>만!`, gen(want){
    let a,b; do{ b=R(3,12); a=R(1,b-1); }while(2*a===b || (2*a>b)!==want);
    return {h:frac(a,b), ok:want, note:`${a}/${b} ${2*a>b?">":"<"} 1/2 (분모 ${b}의 절반은 ${b/2})`};
  }};
}
function rAcute(){
  return {short:"예각", title:`<em>예각</em>만 잡아라!`, gen(want){
    if(want){ const d=Math.random()<.3?R(80,89):R(5,89); return {h:d+"°", ok:true, note:"0°보다 크고 90°보다 작음"}; }
    const d=pick([90,90,R(91,100),R(91,179),R(91,179),180]);
    return {h:d+"°", ok:false, note:d===90?"직각":d===180?"평각":"둔각"};
  }};
}

/* ---------- 중등 ---------- */
function rPrime(){
  const decoy=[1,9,15,21,27,33,39,49,51,57,63,77,87,91];
  return {short:"소수", bluff:"저 소수인데요?", title:`<em>소수</em>만 잡아라!`, gen(want){
    if(want){ const p=pick(PRIMES); return {h:""+p, ok:true, note:"약수가 1과 자기 자신뿐"}; }
    let n; if(Math.random()<.65) n=pick(decoy); else { do{ n=R(4,99); }while(PRIMES.includes(n)); }
    const f=smallestFactor(n);
    return {h:""+n, ok:false, note:n===1?"1은 소수도 합성수도 아님":`${n} = ${f}×${n/f}`};
  }};
}
const NEG_POOL=[
  [`(${M}3)×(${M}2)`,6],[sup(`(${M}2)`,2),4],[M+sup(2,2),-4],[`${M}(${M}5)`,5],[`${M}3+7`,4],[`2${M}9`,-7],

function frame(now){

    for(const c of cells){
      const m=c.cur;

function flushRec(){
  if(!pendingRec) return;
  lastLocalT=addLocal(pendingRec.l,nick(),pendingRec.s); pendingRec=null; $("recBox").hidden=true;
  try{ localStorage.setItem("mole-nick",$("nick").value.trim().slice(0,8)); }catch(e){}
  drawRank();
} const SH={db:null,user:null,uid:null,rows:null,note:""};
function nick(){ return ($("nick").value||"").trim().slice(0,8)||"두더지"; }
function getLocal(){ try{ const v=JSON.parse(localStorage.getItem("mole-rank")||"{}"); return v&&typeof v==="object"?v:{}; }catch(e){ return {}; } }
function addLocal(l,n,sc){
  const all=getLocal(); const arr=Array.isArray(all[l])?all[l]:[]; const row={n,s:sc,t:Date.now()};
  arr.push(row); arr.sort((a,b)=>b.s-a.s); all[l]=arr.slice(0,10);
  try{ localStorage.setItem("mole-rank",JSON.stringify(all)); }catch(e){}
  return row.t;
}
function fillRank(ol,rows){
  ol.textContent="";
  if(!rows.length){ const li=document.createElement("li"); li.className="empty"; li.textContent="아직 기록이 없어요. 첫 주인공이 되어 보세요."; ol.appendChild(li); return; }
  rows.forEach((r,i)=>{
    const li=document.createElement("li"); if(r.me) li.className="me";
    [i+1, r.name, r.score+"점"].forEach(t=>{ const sp=document.createElement("span"); sp.textContent=t; li.appendChild(sp); });
    ol.appendChild(li);
  });
}
async function drawRank(){
  const lv=level;
  $("rankTitle").textContent=`랭킹 · ${LEVELS[lv].name} 출발`;
  const loc=getLocal()[lv]; fillRank($("rankLocal"),(Array.isArray(loc)?loc:[]).map(r=>({name:String(r.n),score:+r.s||0,me:r.t===lastLocalT})));
  if(!SH.db||!SH.rows) return;
  const rows=SH.rows.filter(r=>typeof r[lv]==="number"&&r[lv]>0).sort((a,b)=>b[lv]-a[lv]).slice(0,10);
  let ps={}; try{ ps=await SH.user.profiles(rows.map(r=>r.id)); }catch(e){}
  if(lv!==level) return;
  fillRank($("rankShared"),rows.map(r=>({name:(ps&&ps[r.id]&&ps[r.id].name)||"익명 두더지",score:r[lv],me:r.id===SH.uid})));
}
async function initShared(){
  if(!(window.claude&&window.claude.use)) return;
  let db,user; try{ [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]); }catch(e){ return; }
  if(!db||!user) return;
  SH.db=db; SH.user=user; try{ SH.uid=await user.id(); }catch(e){}
  $("sharedBox").hidden=false; $("sharedNote").textContent="불러오는 중…";
  const timer=setTimeout(()=>{ if(!SH.rows) $("sharedNote").textContent="전체 랭킹을 아직 불러오지 못했어요."; },10000);
  db.collection("scores").onSnapshot(snap=>{
    clearTimeout(timer); SH.rows=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
    $("sharedNote").textContent=SH.note; drawRank();
  },()=>{ clearTimeout(timer); $("sharedNote").textContent="전체 랭킹을 불러올 수 없어요."; });
}
async function submitShared(l,sc){
  if(!SH.db||!SH.uid||sc<=0) return;
  const mine=(SH.rows||[]).find(r=>r.id===SH.uid);
  if(mine && (mine[l]||0)>=sc) return;
  try{
    const ref=SH.db.collection("scores").doc(SH.uid); const snap=await ref.get();
    if(snap.exists) await ref.update({[l]:sc}); else await ref.set({[l]:sc});
  }catch(e){ SH.note="이 계정은 전체 랭킹에 기록할 권한이 없어요. 이 기기 랭킹에는 저장됐습니다."; $("sharedNote").textContent=SH.note; }
}

function endGame(){
  S.running=false;
  cells.forEach(c=>{ c.cur=null; hide(c); });
  board.classList.remove("x3"); wrap.classList.remove("fever");
  beep(523,.15,"sine",.1); setTimeout(()=>beep(659,.15,"sine",.1),140); setTimeout(()=>beep(784,.3,"sine",.1),280);
  const tot=S.stats.reduce((a,s)=>({ok:a.ok+s.ok,bad:a.bad+s.bad,miss:a.miss+s.miss}),{ok:0,bad:0,miss:0});
  const hits=tot.ok+tot.bad; const acc=hits?Math.round(100*tot.ok/hits):0;
  const prev=getBest(level); const isBest=S.score>prev; if(isBest) setBest(level,S.score);
  $("rScore").textContent=S.score;
  $("rSummary").innerHTML=`<span class="rank">${rankOf(S.score)}</span><br>${LEVELS[level].name}에서 출발${S.lv!==level?" → "+LEVELS[S.lv].name+"까지 승급":""} · LAP ${S.mi+1} · 정확도 ${acc}% · 최고 콤보 ${S.maxCombo}`+
    (isBest&&S.score>0 ? `<br><b>최고 점수를 새로 썼습니다.</b>` : (prev?`<br>최고 점수까지 <b>${prev-S.score}점</b> 남았어요. 한 판 더?`:""));
  $("rRows").innerHTML=S.stats.map(s=>`<tr><td>${s.name}</td><td class="n">${s.ok}</td><td class="n">${s.bad}</td><td class="n">${s.miss}</td></tr>`).join("");
  const rv=S.review.slice().sort((a,b)=>(a.kind==="잘못 침"?0:1)-(b.kind==="잘못 침"?0:1)).slice(0,10);
  $("rvTitle").hidden=!rv.length; $("rReview").hidden=!rv.length;
  $("rReview").innerHTML=rv.map(r=>`<li><span class="it">${r.h}</span><span class="tag">${r.kind}</span><span class="why">[${r.rule}] ${r.note}</span></li>`).join("");
  pendingRec = (isBest && S.score>0) ? {l:level,s:S.score} : null; $("recBox").hidden=!pendingRec;
  if(isBest) submitShared(level,S.score);
  drawRank();
  document.body.dataset.screen="result";
}
function goHome(){ flushRec(); if(S) S.running=false; document.body.dataset.screen="start"; wrap.classList.remove("fever"); showBest(); drawRank(); demo(); }

/* ---------- 타격 효과 ---------- */
function strike(x,y){
  const pw=document.createElement("i"); pw.className="pow"; pw.style.left=x+"px"; pw.style.top=y+"px"; document.body.appendChild(pw); pw.addEventListener("animationend",()=>pw.remove());
  board.classList.remove("thump"); void board.offsetWidth; board.classList.add("thump");
}
wrap.addEventListener("pointerdown",e=>{ strike(e.clientX,e.clientY); });

/* ---------- 조작 ---------- */
$("go").addEventListener("click",startGame);
$("recSave").addEventListener("click",flushRec);
$("nick").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); flushRec(); } });
$("again").addEventListener("click",startGame);
$("home").addEventListener("click",goHome);
$("quit").addEventListener("click",goHome);
$("mute").addEventListener("click",e=>{ muted=!muted; e.currentTarget.textContent=muted?"소리 끔":"소리 켬"; e.currentTarget.setAttribute("aria-pressed",muted); });
document.querySelectorAll('input[name="level"]').forEach(r=>r.addEventListener("change",()=>{ level=r.value; showBest(); drawRank(); }));
const KEYS={Numpad7:0,Numpad8:1,Numpad9:2,Numpad4:3,Numpad5:4,Numpad6:5,Numpad1:6,Numpad2:7,Numpad3:8,
  Digit7:0,Digit8:1,Digit9:2,Digit4:3,Digit5:4,Digit6:5,Digit1:6,Digit2:7,Digit3:8,
  KeyQ:0,KeyW:1,KeyE:2,KeyA:3,KeyS:4,KeyD:5,KeyZ:6,KeyX:7,KeyC:8};
document.addEventListener("keydown",e=>{
  if(e.repeat||e.ctrlKey||e.metaKey||e.altKey) return;
  if(S&&S.running && e.code in KEYS){ e.preventDefault(); const r=cells[KEYS[e.code]].el.getBoundingClientRect(); strike(r.left+r.width/2,r.top+r.height*.55,"key"); whack(KEYS[e.code]); }
});
document.addEventListener("visibilitychange",()=>{ if(S) S.last=performance.now(); });

const checked=document.querySelector('input[name="level"]:checked'); if(checked) level=checked.value;
document.body.dataset.screen="start"; showBest(); demo();
try{ $("nick").value=localStorage.getItem("mole-nick")||""; }catch(e){}
$("nick").addEventListener("change",()=>{ try{ localStorage.setItem("mole-nick",$("nick").value.trim().slice(0,8)); }catch(e){} });
drawRank(); initShared();
window.__moleTest={LEVELS,plain,rad,show,cells,sup,log,frac,poly};
})();
</script>
